name: Request reviewers for GoReleaser PRs

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  request-reviewers:
    if: github.event.pull_request.user.login == 'dev-platform-esc'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Verify GoReleaser marker and request reviewers
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = 'Automated with GoReleaser';
            const pullRequest = context.payload.pull_request;

            if (!(pullRequest.body ?? '').includes(marker)) {
              core.info('GoReleaser marker not found; no reviewers requested.');
              return;
            }

            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequest.number,
              reviewers: ['wwwMalcolm', 'homeyong'],
            });
